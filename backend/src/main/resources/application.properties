spring.application.name=ProjetoFinalIntegrador

# O runtime de container do Vercel injeta PORT. Fora dele, 8080.
server.port=${PORT:8080}
# O container recebe SIGTERM com 30s de carência ao escalar para zero.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=25s

# Conexão. Por padrão, o Postgres do Supabase pelo pooler de transação
# (IPv4, porta 6543). A conexão direta db.<ref>.supabase.co é só IPv6.
# prepareThreshold=0: o pooler em modo transação não mantém prepared statements.
# Para usar o Postgres do pod local, defina DB_URL, DB_USER e DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:postgresql://aws-0-sa-east-1.pooler.supabase.com:6543/postgres?sslmode=require&prepareThreshold=0}
spring.datasource.username=${DB_USER:postgres.hiieswbpwrlggryqhtjv}
# A senha nunca vai para o Git: vem da variável DB_PASSWORD ou do arquivo
# application-local.properties (ignorado pelo Git e pela imagem Docker).
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.config.import=optional:classpath:application-local.properties

# Serverless escala para zero e sobe várias instâncias: pool pequeno por
# instância, para não esgotar as conexões do Postgres gerenciado.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}

# O esquema pertence ao Flyway. O Hibernate apenas confere se o mapeamento
# corresponde ao que as migrações criaram.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

# As migrações são aplicadas pelo pipeline de deploy (mvn flyway:migrate),
# antes da nova versão receber tráfego. No boot a aplicação apenas confere o
# esquema, via ddl-auto=validate: se faltar migração, ela recusa subir.
# Em desenvolvimento vale ligar FLYWAY_MIGRAR_NO_BOOT para poupar um comando.
spring.flyway.enabled=${FLYWAY_MIGRAR_NO_BOOT:false}
spring.flyway.locations=classpath:db/migration
