spring.application.name=ProjetoFinalIntegrador

# O runtime de container do Vercel injeta PORT. Fora dele, 8080.
server.port=${PORT:8080}
# O container recebe SIGTERM com 30s de carência ao escalar para zero.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=25s

# Conexão. Sem credencial em código: tudo vem do ambiente.
# Em desenvolvimento os defaults apontam para o Postgres do pod local.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/tcc}
spring.datasource.username=${DB_USER:tcc}
spring.datasource.password=${DB_PASSWORD:tcc}
spring.datasource.driver-class-name=org.postgresql.Driver

# Serverless escala para zero e sobe várias instâncias: pool pequeno por
# instância, para não esgotar as conexões do Postgres gerenciado.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}

# O esquema pertence ao Flyway. O Hibernate apenas confere se o mapeamento
# corresponde ao que as migrações criaram.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

# As migrações são aplicadas pelo pipeline de deploy (mvn flyway:migrate),
# antes da nova versão receber tráfego. No boot a aplicação apenas confere o
# esquema, via ddl-auto=validate: se faltar migração, ela recusa subir.
# Em desenvolvimento vale ligar FLYWAY_MIGRAR_NO_BOOT para poupar um comando.
spring.flyway.enabled=${FLYWAY_MIGRAR_NO_BOOT:false}
spring.flyway.locations=classpath:db/migration

# Autenticação. O segredo assina os JWT e precisa ser o mesmo em todas as
# instâncias (>= 32 bytes; gere com `openssl rand -base64 48`). Sem ele um
# segredo aleatório é gerado no boot: serve só para desenvolvimento.
auth.jwt.segredo=${JWT_SEGREDO:}
auth.jwt.validade-minutos=${JWT_VALIDADE_MINUTOS:15}
auth.renovacao.validade-dias=${JWT_RENOVACAO_DIAS:7}
auth.login.tentativas-ate-bloquear=${AUTH_TENTATIVAS_ATE_BLOQUEAR:5}
auth.login.bloqueio-minutos=${AUTH_BLOQUEIO_MINUTOS:15}
# Fechado por padrão: quem entra na gestão é criado pela administração. Aberto,
# a conta nasce com o papel PUBLICO, que só acompanha.
auth.cadastro-aberto=${AUTH_CADASTRO_ABERTO:false}
# Ligado: sem login só /publico/** e as rotas de entrar; a gestão exige papel.
# Desligar abre a API inteira — só para diagnóstico local.
auth.exigir-login=${AUTH_EXIGIR_LOGIN:true}
# Primeiro administrador, criado no boot se o e-mail ainda não existir.
auth.admin.email=${ADMIN_EMAIL:}
auth.admin.senha=${ADMIN_SENHA:}
auth.admin.nome=${ADMIN_NOME:Administrador}
