# Os testes usam o Postgres do ambiente local, o mesmo do dia a dia.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/tcc}
spring.datasource.username=${DB_USER:tcc}
spring.datasource.password=${DB_PASSWORD:tcc}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
