# Só o banco, para rodar a API pela IDE (ou mvn spring-boot:run em backend/)
# e o front por yarn dev em frontend/.
#
#   podman play kube deploy/postgres-local.yaml
#
# Os defaults de application.properties já apontam para este pod (porta 5433 no
# host, para não colidir com um Postgres local em 5432).
apiVersion: v1
kind: Pod
metadata:
  name: tcc-postgres
  labels:
    app: tcc-postgres
spec:
  containers:
    - name: postgres
      image: docker.io/library/postgres:16-alpine
      env:
        - name: POSTGRES_DB
          value: tcc
        - name: POSTGRES_USER
          value: tcc
        - name: POSTGRES_PASSWORD
          value: tcc
      ports:
        - containerPort: 5432
          hostPort: 5433
      volumeMounts:
        - name: dados-postgres
          mountPath: /var/lib/postgresql/data
  volumes:
    - name: dados-postgres
      persistentVolumeClaim:
        claimName: tcc-postgres
