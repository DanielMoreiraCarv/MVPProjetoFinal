# Blueprint do Render para a API (Spring Boot).
# No painel do Render: New > Blueprint > escolha este repositório.
# As variáveis marcadas com sync: false são pedidas na criação e nunca
# ficam no repositório. Valores em documentos/persistencia-e-deploy.md.
services:
  - type: web
    # Virginia: o Render não tem região na América do Sul, e Virginia é a
    # mais próxima do Supabase (sa-east-1) e fica ao lado do front no Vercel
    # (iad1). O Render não muda a região de um serviço existente, por isso o
    # nome novo: o Blueprint cria este serviço, e o antigo (tcc-api, Oregon)
    # é apagado à mão depois que o front apontar para cá.
    name: tcc-api-virginia
    region: virginia
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    branch: main
    autoDeploy: true
    # Só o processo, sem o banco: uma oscilação do Supabase não faz o Render
    # reiniciar a API. O banco é conferido por /actuator/health.
    healthCheckPath: /actuator/health/liveness
    envVars:
      # Session pooler do Supabase (porta 5432): uma instância só, sempre
      # ligada, então a própria API aplica as migrações ao subir.
      - key: DB_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: FLYWAY_MIGRAR_NO_BOOT
        value: "true"
      - key: JWT_SEGREDO
        generateValue: true
      - key: CORS_ORIGENS
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_SENHA
        sync: false
      # Cabe nos 512 MB do plano gratuito. Heap em 60% deixa espaço para
      # metaspace, code cache e threads, que ficam fora do heap; com 75% o
      # processo inteiro pode passar de 512 MB e o Render o mata (OOM).
      # ExitOnOutOfMemoryError faz a JVM sair e o Render reiniciar limpo,
      # em vez de ficar viva respondendo erro.
      - key: JAVA_TOOL_OPTIONS
        value: "-XX:MaxRAMPercentage=60 -XX:MaxMetaspaceSize=160m -XX:ReservedCodeCacheSize=48m -Xss512k -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -XX:+ExitOnOutOfMemoryError"
