# Blueprint do Render para a API (Spring Boot).
# No painel do Render: New > Blueprint > escolha este repositório.
# As variáveis marcadas com sync: false são pedidas na criação e nunca
# ficam no repositório. Valores em documentos/persistencia-e-deploy.md.
services:
  - type: web
    name: tcc-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    branch: main
    autoDeploy: true
    healthCheckPath: /api/v1/publico/competicao
    envVars:
      # Session pooler do Supabase (porta 5432): uma instância só, sempre
      # ligada, então a própria API aplica as migrações ao subir.
      - key: DB_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: FLYWAY_MIGRAR_NO_BOOT
        value: "true"
      - key: JWT_SEGREDO
        generateValue: true
      - key: CORS_ORIGENS
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_SENHA
        sync: false
      # Cabe nos 512 MB do plano gratuito.
      - key: JAVA_TOOL_OPTIONS
        value: "-XX:MaxRAMPercentage=75 -XX:+UseSerialGC -XX:TieredStopAtLevel=1"
